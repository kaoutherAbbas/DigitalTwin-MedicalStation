version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: medical_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medical_station

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  mosquitto:
    image: eclipse-mosquitto
    container_name: mqtt_broker

    ports:
      - "1883:1883"

    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend

    depends_on:
      - postgres
      - mosquitto

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  simulator:
    build: ./simulator

    depends_on:
      - mosquitto

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:

  postgres_data: